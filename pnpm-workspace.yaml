packages:
  - .

allowBuilds:
  esbuild: true
  puppeteer: true
  sharp: true
  unrs-resolver: true
  workerd: true

autoInstallPeers: true
strictPeerDependencies: false

overrides:
  postcss: ^8.5.10
  "postcss-selector-parser@^6": ">=6.1.5 <7"
  source-map-js: "1.2.2"
  "typescript-eslint@^8": ">=8.74.0 <9"
  "undici@^7": ">=7.30.1 <8"

packageImportMethod: clone-or-copy
